<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title id="pageTitle">تفاصيل الأداة | عاداتي برو</title>

  <!-- iOS & PWA Viewport & Fullscreen Meta Tags -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="عاداتي برو">
  <meta name="format-detection" content="telephone=no">

  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121316">

  <!-- Icons & Web Manifest -->
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="manifest" href="manifest.json">

  <!-- Core Bento Editorial Pro Modular Stylesheets -->
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">

  <!-- Zero-Scrollbar Strict Enforcement (Pure Apple Experience) -->
  <style>
    html, body, *, *::before, *::after {
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }
    ::-webkit-scrollbar,
    *::-webkit-scrollbar,
    html::-webkit-scrollbar,
    body::-webkit-scrollbar {
      display: none !important;
      width: 0px !important;
      height: 0px !important;
      max-width: 0px !important;
      max-height: 0px !important;
      background: transparent !important;
      -webkit-appearance: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
    }

    /* Dedicated Tool Page Layout */
    .tool-page-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
    }

    .tool-header-hero {
      background: var(--card-white);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-radius: var(--radius-bento);
      padding: clamp(20px, 4.5vw, 32px);
      box-shadow: var(--shadow-bento);
      border: 1px solid var(--border-glass);
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
      overflow: hidden;
    }

    .tool-header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .tool-identity-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .tool-hero-icon {
      width: clamp(56px, 12vw, 72px);
      height: clamp(56px, 12vw, 72px);
      border-radius: 22px;
      background: var(--card-gray-subtle);
      border: 1px solid var(--border-glass);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(28px, 6vw, 36px);
      box-shadow: var(--shadow-sm);
      flex-shrink: 0;
    }

    .tool-hero-titles {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .tool-hero-num {
      font-size: 12px;
      font-weight: 800;
      color: var(--ios-blue);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .tool-hero-title {
      font-size: clamp(22px, 5.5vw, 32px);
      font-weight: 900;
      color: var(--text-primary);
      line-height: 1.25;
      letter-spacing: -0.5px;
    }

    .tool-hero-author {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-secondary);
    }

    .tool-hero-tagline {
      font-size: clamp(14px, 3.5vw, 16px);
      font-weight: 750;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .tool-pill-meta-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding-top: 4px;
    }

    /* Grid for Tool Body: Left Interactive Machine, Right Scientific Theory */
    .tool-main-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      width: 100%;
    }
    @media (min-width: 900px) {
      .tool-main-grid {
        grid-template-columns: 1.15fr 0.85fr;
      }
    }

    .tool-machine-card {
      background: var(--card-white);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-radius: var(--radius-bento);
      padding: clamp(20px, 4vw, 28px);
      box-shadow: var(--shadow-bento);
      border: 1px solid var(--border-glass);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .machine-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 12px;
    }

    .machine-title {
      font-size: 18px;
      font-weight: 850;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tool-guide-card {
      background: var(--card-white);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-radius: var(--radius-bento);
      padding: clamp(20px, 4vw, 28px);
      box-shadow: var(--shadow-bento);
      border: 1px solid var(--border-glass);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .guide-section-title {
      font-size: 16px;
      font-weight: 850;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .guide-desc-text {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.7;
    }

    .steps-ordered-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .step-list-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--text-primary);
      background: var(--card-gray-subtle);
      padding: 12px 14px;
      border-radius: 16px;
      border: 1px solid var(--border-glass);
    }
    .step-number-badge {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--ios-blue);
      color: #FFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 900;
      flex-shrink: 0;
    }

    /* Eisenhower Grid in Full View */
    .eisen-full-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    @media (min-width: 600px) {
      .eisen-full-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
    .eisen-quad-box {
      border-radius: 18px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 120px;
    }
    .eisen-quad-box.q1 { background: rgba(239, 68, 68, 0.08); border: 1.5px solid rgba(239, 68, 68, 0.3); }
    .eisen-quad-box.q2 { background: rgba(59, 130, 246, 0.08); border: 1.5px solid rgba(59, 130, 246, 0.3); }
    .eisen-quad-box.q3 { background: rgba(245, 158, 11, 0.08); border: 1.5px solid rgba(245, 158, 11, 0.3); }
    .eisen-quad-box.q4 { background: rgba(107, 114, 128, 0.08); border: 1.5px solid rgba(107, 114, 128, 0.3); }

    .eisen-task-item {
      background: var(--card-white);
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 13px;
      font-weight: 750;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }

    .audio-waves-row {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 24px;
    }
    .audio-wave-bar {
      width: 4px;
      height: 8px;
      background: var(--ios-blue);
      border-radius: 999px;
      transition: height 0.15s ease;
    }
    .wave-active .audio-wave-bar:nth-child(1) { animation: wavePulse 0.8s infinite ease-in-out alternate; }
    .wave-active .audio-wave-bar:nth-child(2) { animation: wavePulse 0.6s infinite ease-in-out alternate 0.2s; }
    .wave-active .audio-wave-bar:nth-child(3) { animation: wavePulse 1.0s infinite ease-in-out alternate 0.4s; }
    .wave-active .audio-wave-bar:nth-child(4) { animation: wavePulse 0.7s infinite ease-in-out alternate 0.1s; }
    @keyframes wavePulse {
      0% { height: 6px; }
      100% { height: 24px; }
    }
  </style>
</head>

<!-- Universal Command Palette Modal (Cmd + K) -->
<div id="commandPaletteModal" class="command-palette-overlay" style="display:none;">
  <div class="command-palette-box" role="dialog" aria-modal="true">
    <div class="command-search-header">
      <span class="command-search-icon">⌘</span>
      <input type="text" id="commandPaletteInput" class="command-search-input" placeholder="ابحث عن أداة، أو تنقل سريعاً... (أو اضغط Esc للإغلاق)" autocomplete="off">
      <span class="command-shortcut-hint">ESC</span>
    </div>
    <div class="command-quick-tabs">
      <button type="button" class="command-tab-chip active" data-cmd-filter="all">الكل</button>
      <button type="button" class="command-tab-chip" data-cmd-filter="tools">الأدوات (15)</button>
      <button type="button" class="command-tab-chip" data-cmd-filter="pages">الصفحات</button>
      <button type="button" class="command-tab-chip" data-cmd-filter="actions">إجراءات سريعة</button>
    </div>
    <div class="command-results-list" id="commandResultsList">
      <!-- Injected Dynamically -->
    </div>
    <div class="command-palette-footer">
      <div class="command-footer-hints">
        <span><kbd class="kbd-key">↑</kbd><kbd class="kbd-key">↓</kbd> للتنقل</span>
